<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>机位管理 · MacBuild</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e5a48'/%3E%3Crect x='8' y='10' width='16' height='12' rx='3' fill='none' stroke='%23faf7f0' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23faf7f0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap { max-width: 940px; margin: 0 auto; padding: 32px 20px 80px; }
  .admin-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .admin-head h1 { font-size: 24px; margin: 0; }
  .admin-sub { font-size: 13.5px; color: var(--muted); margin: 0 0 22px; }

  .login-box { max-width: 420px; margin: 12vh auto; }
  .login-box h1 { font-size: 22px; margin: 0 0 8px; }
  .login-box p { font-size: 13.5px; color: var(--muted); margin: 0 0 20px; line-height: 1.7; }
  .login-box code { background: var(--paper-alt); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .login-box input {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 15px;
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--paper); color: var(--ink); margin-bottom: 12px;
  }
  .login-box input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .login-box button { width: 100%; }

  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .stat { padding:8px 14px; background:var(--paper-alt); border:1px solid var(--line); border-radius:999px; font-size:13.5px; color:var(--muted); }
  .stat b { color: var(--ink); font-size:15px; }

  .dev-list { display:grid; gap:12px; }
  .dev {
    display:grid; grid-template-columns: 84px 1fr; gap:14px; align-items:start;
    padding:14px 16px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg);
  }
  .dev-code { font-family: var(--mono); font-size:15px; font-weight:700; padding-top:2px; }
  .dev-right { display:flex; flex-direction:column; gap:10px; }
  .dev-spec { font-size:13px; color:var(--ink-soft); }
  .dev-meta { font-size:12.5px; color:var(--muted); }
  .dev-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .seg-btn {
    padding:6px 13px; font:inherit; font-size:12.5px; font-weight:600;
    border:1px solid var(--line-strong); border-radius:999px;
    background:transparent; color:var(--ink-soft); cursor:pointer;
    transition: background .15s, color .15s, border-color .15s;
    white-space:nowrap;
  }
  .seg-btn:hover { background: var(--paper-alt); }
  .seg-btn.on-available { background:#2e8b57; border-color:#2e8b57; color:#fff; }
  .seg-btn.on-reserved  { background:#8a5a1e; border-color:#8a5a1e; color:#fff; }
  .seg-btn.on-rented    { background:#b02a2a; border-color:#b02a2a; color:#fff; }
  .seg-btn.on-maintenance { background:#6b6862; border-color:#6b6862; color:#fff; }
  .seg-btn:disabled { opacity:.5; cursor:wait; }

  .promo-btn {
    padding:5px 12px; font:inherit; font-size:12px; font-weight:600;
    border:1px dashed var(--line-strong); border-radius:999px;
    background:transparent; color:var(--muted); cursor:pointer;
  }
  .promo-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); border-style: solid; }
  .promo-btn:disabled { opacity:.5; cursor:wait; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    padding: 11px 20px; font-size: 14px; color:#fff; background:#1a1a18;
    border-radius: 999px; opacity:0; pointer-events:none; transition: all .22s; z-index: 99;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity:1; transform: translateX(-50%) translateY(0); }
  .toast.err { background:#b02a2a; }

  .logout { font-size:13px; color:var(--muted); background:none; border:none; cursor:pointer; text-decoration:underline; }
  .legend { font-size:12.5px; color:var(--muted); margin: 0 0 18px; line-height:1.8; }
</style>
</head>
<body>

<div class="admin-wrap login-box" id="loginView">
  <h1>机位管理</h1>
  <p>输入管理员 Token。这串在 Cloudflare Pages 的 <code>ADMIN_TOKEN</code> 环境变量里。</p>
  <input id="tokenInput" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password">
  <button class="btn btn-lg btn-block" id="loginBtn">进入</button>
  <p style="margin-top:16px;font-size:12.5px;color:var(--muted)">
    Token 只存在这台设备的内存（sessionStorage）里，关掉标签页就失效。
  </p>
</div>

<div class="admin-wrap" id="panelView" style="display:none">
  <div class="admin-head">
    <h1>机位管理</h1>
    <button class="logout" id="logoutBtn">退出</button>
  </div>
  <p class="admin-sub">点按钮即时保存 · 数据源 Cloudflare D1 · <a href="/#fleet" target="_blank">查看前台效果 ↗</a></p>

  <div class="stats" id="stats"></div>
  <p class="legend">
    <b>状态</b>：可预约 = 客户能租 ｜ 已预约 = 已锁定但未开始 ｜ 使用中 = 正在被租 ｜ 维护中 = 不可租<br>
    <b>福利</b>：历史促销标记位，现已停用（当前统一按 ¥899/月 报价）。保留字段便于以后再做活动。
  </p>

  <div class="dev-list" id="devList"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const KEY = 'mb_admin_token';
let token = sessionStorage.getItem(KEY) || '';
let devices = [];

const loginView = document.getElementById('loginView');
const panelView = document.getElementById('panelView');
const tokenInput = document.getElementById('tokenInput');
const toastEl = document.getElementById('toast');

const STATUS_LABEL = { available: '可预约', reserved: '已预约', rented: '使用中', maintenance: '维护中' };
const STATUS_ORDER = ['available', 'reserved', 'rented', 'maintenance'];

function toast(msg, isErr) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toastEl.className = 'toast'; }, 2400);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json', ...(opts.headers || {}) },
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}

function render() {
  const counts = { total: devices.length, available: 0, reserved: 0, rented: 0, maintenance: 0, promo: 0 };
  devices.forEach(d => {
    if (counts[d.status] !== undefined) counts[d.status]++;
    if (d.status === 'available' && d.promoEligible) counts.promo++;
  });

  document.getElementById('stats').innerHTML =
    `<span class="stat">全部 <b>${counts.total}</b></span>` +
    `<span class="stat">可预约 <b>${counts.available}</b></span>` +
    `<span class="stat">已预约 <b>${counts.reserved}</b></span>` +
    `<span class="stat">使用中 <b>${counts.rented}</b></span>` +
    `<span class="stat">维护中 <b>${counts.maintenance}</b></span>` +
    `<span class="stat">可享福利 <b>${counts.promo}</b></span>`;

  document.getElementById('devList').innerHTML = devices.map(d => {
    const btns = STATUS_ORDER.map(s =>
      `<button class="seg-btn ${d.status === s ? 'on-' + s : ''}" data-code="${d.code}" data-status="${s}">${STATUS_LABEL[s]}</button>`
    ).join('');

    const promo = `<button class="promo-btn ${d.promoEligible ? 'on' : ''}" data-code="${d.code}" data-promo="${d.promoEligible ? 0 : 1}">` +
      (d.promoEligible ? '福利未使用' : '福利已使用') + `</button>`;

    return `<div class="dev">
      <div class="dev-code">${d.code}</div>
      <div class="dev-right">
        <div>
          <div class="dev-spec">${d.spec || '—'} · ¥${d.price}/月</div>
          <div class="dev-meta">${d.location || ''} · ${d.network || ''}${d.note ? ' · ' + d.note : ''}</div>
        </div>
        <div class="dev-actions">${btns}${promo}</div>
      </div>
    </div>`;
  }).join('');
}

async function load() {
  const j = await api('/api/admin/devices');
  devices = j.devices || [];
  loginView.style.display = 'none';
  panelView.style.display = '';
  render();
}

async function patch(code, payload) {
  const btns = document.querySelectorAll(`[data-code="${code}"]`);
  btns.forEach(b => b.disabled = true);
  try {
    await api('/api/admin/devices', { method: 'POST', body: JSON.stringify({ code, ...payload }) });
    const d = devices.find(x => x.code === code);
    if (d) Object.assign(d, payload);
    render();
    toast(code + ' 已更新');
  } catch (e) {
    toast('失败：' + e.message, true);
    btns.forEach(b => b.disabled = false);
  }
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  token = tokenInput.value.trim();
  if (!token) { toast('请输入 Token', true); return; }
  sessionStorage.setItem(KEY, token);
  try {
    await load();
  } catch (e) {
    toast('登录失败：' + e.message, true);
    sessionStorage.removeItem(KEY);
    token = '';
  }
});

tokenInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem(KEY);
  token = '';
  panelView.style.display = 'none';
  loginView.style.display = '';
  tokenInput.value = '';
});

// 事件委托：状态按钮
document.getElementById('devList').addEventListener('click', e => {
  const sb = e.target.closest('.seg-btn');
  if (sb) { patch(sb.dataset.code, { status: sb.dataset.status }); return; }
  const pb = e.target.closest('.promo-btn');
  if (pb) { patch(pb.dataset.code, { promoEligible: pb.dataset.promo === '1' }); }
});

if (token) load().catch(() => { sessionStorage.removeItem(KEY); token = ''; });
</script>

</body>
</html>
